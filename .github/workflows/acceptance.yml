name: ORVION Sandbox Acceptance
on:
  push:
    branches: [orvion-preflight]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    name: orvion-acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Synthetic outcome only
        shell: bash
        run: |
          mode="$(cat probe-mode.txt)"
          case "$mode" in
            success) printf 'Synthetic success\n' ;;
            failure) printf 'Synthetic failure\n'; exit 1 ;;
            *) printf 'Unknown synthetic mode\n'; exit 2 ;;
          esac
